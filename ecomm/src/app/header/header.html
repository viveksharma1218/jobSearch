<div class="header">
    <div class="logo">
        <a routerLink="profile" class="logoTitle">SearchJobs</a>
    </div>
    <div>
        <input type="search">
        <button>Search</button>
    </div>
    <div class="headerFormGroup">
        <form [formGroup]="FiltersGroup">
            <div class="title">
            <select class="formTitle" formControlName="selectedTitle">
                <option>AllProfile</option>
                @for(title of allTitles; track title){
                    <option>{{title}}</option>
                }
            </select>
            </div>
            <div class="companies">
                <select class="formCompanies" formControlName="selectedCompany">
                    <option>AllCompany</option>
                    @for(company of allCompanies; track company){
                        <option>{{company}}</option>
                    }
                </select>
            </div>
            <div class="locations">
                <select class="formLocation" formControlName="selectedLocation">
                    <option>AllLocation</option>
                    @for(location of allLocations; track location){
                        <option>{{location}}</option>
                    }
                </select>
            </div>
        </form>
    </div>
    
    
</div>
